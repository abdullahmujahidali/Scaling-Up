name: Deploy to GitHub Pages

# Deploys the static site (plain HTML/CSS/JS at repo root) to GitHub Pages.
# Replaces the flaky auto "legacy" Pages deploy with an explicit, controllable workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-run manually from the Actions tab

# Permissions the deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'          # the whole repo root is the site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
